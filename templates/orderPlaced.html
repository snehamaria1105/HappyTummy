<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - HappyTummy</title>
    <link rel="stylesheet" href="../static/css/cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="order-success">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Order Placed Successfully!</h1>
        <div style="margin: 30px 0;">
            <a href="/bill/{{ order_id }}" class="back-btn"
                style="background:#FFAA00; color:#fff; border:none; border-radius:4px; padding:12px 25px; font-weight:bold; display:inline-block; margin-right:15px; text-decoration:none; box-shadow:0 4px 10px rgba(255,170,0,0.3);"><i
                    class="fa-solid fa-file-invoice" style="margin-right:8px;"></i> View & Download E-Bill</a>
            <a href="/restaurants" class="back-btn"
                style="background:#f4f4f4; color:#444; border:1px solid #ddd; border-radius:4px; padding:12px 25px; font-weight:bold; display:inline-block; text-decoration:none;"><i
                    class="fa-solid fa-utensils" style="margin-right:8px;"></i> Continue Shopping</a>
        </div>
    </div>
</body>

</html>
